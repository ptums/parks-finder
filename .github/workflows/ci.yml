name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Forbid .only, .skip and .todo in tests
        run: |
          if grep -rEn --include='*.test.ts' --include='*.test.tsx' --include='*.spec.ts' '\.(only|skip|todo)\(' web shared server scripts e2e; then
            echo "Remove .only/.skip/.todo from tests"; exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
