# Deploy from the repo root so the build context is the repo root:
#   fly deploy --config deploy/fly.web.toml --dockerfile deploy/web.Dockerfile
app = "peter-parks-web"
primary_region = "dfw"

[build]
  dockerfile = "web.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
